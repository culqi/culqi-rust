[package]
name = "BrandoCulqi"
version = "1.0.4"
edition = "2024"
description = "API bindings for the Culqi v2 HTTP API"
authors = ["Team Culqi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/culqi/culqi-rust"
documentation = "https://docs.rs/culqi/0.1.0/culqi_rust/"
keywords = ["culqi", "v2", "api"]
categories = ["api-bindings"]
exclude = ["examples/new_charge.rs"]

[dependencies]
nom = "7.1.3"
hyper = "0.14"
reqwest = "0.12.9"
tokio = { version = "1.42.0", features = ["full"] }
aes-gcm = "0.10.3"
rand = "0.8"
base64 = "0.22.1"
rsa = "0.9.5"
pem = "3.0.4"
regex = "1.11.1"
sha2 = "0.10.8"
aes = "0.8.4"
openssl = "0.10.68"
serde_json = "1.0.134"
chrono = "0.4.39"
serde = { version = "1.0.216", features = ["derive"] }
anyhow = "1.0.95"
warp = "0.3.7"
serial_test = "3.2.0"
